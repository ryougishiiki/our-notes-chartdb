name: chartdb

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing a release or Pages site
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types:
      - our-notes-chart-update

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.build.outputs.has_changes }}
      dry_run: ${{ steps.build.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: .chartdb-cache
          key: chartdb-${{ github.run_id }}
          restore-keys: chartdb-

      - name: Build, validate and render the site
        id: build
        env:
          CHARTDB_SOURCE_EVENT_ID: ${{ github.event.client_payload.eventId || '' }}
          CHARTDB_DRY_RUN: ${{ (github.event_name == 'repository_dispatch' && github.event.client_payload.dryRun == true) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          bash ci/run.sh
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          gate = json.loads(Path("dist/gate.json").read_text(encoding="utf-8"))
          print(f"has_changes={str(bool(gate['hasChanges'])).lower()}")
          PY
          echo "dry_run=${CHARTDB_DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        if: steps.build.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chartdb-release-files
          path: |
            dist/gate.json
            dist/manifest.json
            dist/release-notes.md
            dist/*.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: Upload static site
        if: steps.build.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chartdb-site
          path: dist/site
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.has_changes == 'true' && needs.build.outputs.dry_run != 'true'
    concurrency:
      group: chartdb-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: chartdb-release-files
          path: dist

      - name: Publish database release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publish_release.sh dist

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: chartdb-site
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

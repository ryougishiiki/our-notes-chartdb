name: chartdb
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: .chartdb-cache
          key: chartdb-${{ github.run_id }}
          restore-keys: chartdb-
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/run.sh